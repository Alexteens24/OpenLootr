name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build ciArtifact --stacktrace
      - run: sha256sum build/ci/OpenLootr.jar
      - uses: actions/upload-artifact@v6
        with:
          name: openlootr-production
          path: build/ci/OpenLootr.jar
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft-version: ['1.21.11', '26.1.2', '26.2']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v7
        with:
          name: openlootr-production
          path: build/ci
      - run: sha256sum build/ci/OpenLootr.jar
      - run: bash .github/scripts/runtime-smoke.sh '${{ matrix.minecraft-version }}' build/ci/OpenLootr.jar
