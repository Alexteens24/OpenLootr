name: OpenLootr
version: '${version}'
main: me.alexisbinh.openlootr.OpenLootrPlugin
bootstrapper: me.alexisbinh.openlootr.OpenLootrBootstrap
api-version: '1.21.11'
folia-supported: true
author: AlexisBinh
description: Paper-native persistent personal loot for structure containers

permissions:
  openlootr.command.info:
    description: View OpenLootr runtime and persistence health
    default: op
  openlootr.command.inspect:
    description: Inspect a target loot container and its persisted state
    default: op
  openlootr.command.debug:
    description: View read-only OpenLootr runtime diagnostics
    default: op
  openlootr.command.repair:
    description: Safely repair one narrowly-defined partial double chest identity
    default: op
